[package]
name = "issue_tracker"
version = "0.1.0"
description = "A local issue report tracker"
edition = "2021"

[lib]
name = "issue_tracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
rusqlite = { version = "0.43", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", features = ["json"] }
chrono = "0.4"
dirs = "7"
rmcp = { version = "3.11", default-features = false, features = ["server", "schemars", "transport-io"] }
schemars = "1.2"
tokio = { version = "1", features = ["rt", "io-std"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"
